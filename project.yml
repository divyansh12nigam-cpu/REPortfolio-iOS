name: REPortfolio-iOS
options:
  bundleIdPrefix: com.re
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.re.portfolio.ios
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: ""
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  REPortfolio-iOS:
    type: application
    platform: iOS
    sources:
      - path: REPortfolioApp.swift
      - path: DesignSystem
      - path: Data
      - path: Utils
      - path: UI
    dependencies:
      - package: Supabase
        product: Supabase
    # NOTE: Uncomment the entitlements block below when you have a paid
    # Apple Developer Program membership ($99/year). Sign in with Apple
    # requires a paid team — free/personal teams don't support it.
    # entitlements:
    #   path: REPortfolio-iOS.entitlements
    #   properties:
    #     com.apple.developer.applesignin:
    #       - Default
    settings:
      base:
        PRODUCT_NAME: REPortfolio
        DEVELOPMENT_TEAM: UAQ4892BS9
        CODE_SIGN_STYLE: Automatic
